# XcodeGen spec, used only by the reference build in .github/workflows/tflab-xcode.yml
name: TFLab
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  TFLab:
    type: application
    platform: iOS
    sources:
      - Sources/TFLab
      - Resources/Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: fr.gulian.tflab
      PRODUCT_NAME: TFLab
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1,2"
      # Xcode adds the bundle keys to the same Info.plist xtool uses
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: Resources/Info.plist
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      CODE_SIGNING_ALLOWED: NO
