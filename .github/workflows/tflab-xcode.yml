# Reference build of Examples/TFLab with Xcode, unsigned, to compare with the .ipa xtool builds on Linux.
# Sign and upload the result with `xtool sign` and `xtool upload`.
name: TFLab reference (Xcode)
on:
  push:
    branches: [testflight-linux]
    paths:
      - .github/workflows/tflab-xcode.yml
      - Examples/TFLab*/**
env:
  # CFBundleVersion of the reference build, above the ones uploaded from Linux
  BUILD: ${{ github.run_number }}0
jobs:
  build:
    strategy:
      matrix:
        app: [TFLab, TFLabMulti, TFLabRich]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          sw_vers
      - run: brew install xcodegen
      - name: Build
        working-directory: Examples/${{ matrix.app }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" Resources/Info.plist
          xcodegen generate
          xcodebuild -project TFLab.xcodeproj -scheme TFLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TFLab.xcarchive" archive CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD" MARKETING_VERSION=1.0
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/TFLab.xcarchive/Products/Applications/TFLab.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry TFLab-xcode.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-xcode-${{ env.BUILD }}
          path: ${{ runner.temp }}/ipa/TFLab-xcode.ipa
